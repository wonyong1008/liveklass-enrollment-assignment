spring:
  application:
    name: enrollment
  profiles:
    active: local
  # 인증은 JwtAuthenticationFilter가 전담하므로 스프링 시큐리티 기본 폼로그인용
  # 자동생성 계정(랜덤 비밀번호 로그 출력)은 사용하지 않는다.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 결제 확정(CONFIRMED) 후 이 기간이 지나면 취소 불가
enrollment:
  cancellable-days: 7

jwt:
  # 운영 환경에서는 반드시 환경변수로 주입 (여기 기본값은 로컬 개발용)
  secret: ${JWT_SECRET:liveklass-assignment-local-dev-secret-key-please-rotate}
  expiration-seconds: 3600

logging:
  level:
    com.liveklass.enrollment: debug
