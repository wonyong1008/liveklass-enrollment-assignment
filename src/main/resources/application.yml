spring:
  application:
    name: enrollment
  profiles:
    active: local

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 결제 확정(CONFIRMED) 후 이 기간이 지나면 취소 불가
enrollment:
  cancellable-days: 7

jwt:
  # 운영 환경에서는 반드시 환경변수로 주입 (여기 기본값은 로컬 개발용)
  secret: ${JWT_SECRET:liveklass-assignment-local-dev-secret-key-please-rotate}
  expiration-seconds: 3600

logging:
  level:
    com.liveklass.enrollment: debug
